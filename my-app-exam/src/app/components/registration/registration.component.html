<div fxLayout="row" style="padding-bottom: 25px">
  <mat-label>Customer Registration</mat-label>
</div>
<form #clientForm="ngForm" (ngSubmit)="onSave(clientForm)">
  <div>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>First Name</mat-label>
      <input
        name="firstName"
        required
        matInput
        placeholder="First Name"
        [(ngModel)]="firstName"
      />
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Last Name</mat-label>
      <input
        name="lastName"
        required
        matInput
        placeholder="Last Name"
        [(ngModel)]="lastName"
      />
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Phone</mat-label>
      <input
        matInput
        name="phone"
        required
        placeholder="Phone"
        [(ngModel)]="phone"
        pattern="^[0-9]+$"
      />
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
  <mat-label>Email</mat-label>
  <input
    matInput
    name="email"
    placeholder="Email"
    [(ngModel)]="email"
    required
    email>
</mat-form-field>
  </div>

  <div fxLayout="row" fxLayoutAlign="end center">
    <button mat-raised-button color="primary" type="submit">Save</button>
  </div>
</form>
<div fxLayout="row" style="padding-top: 40px">
  <mat-table matTableResponsive [dataSource]="dataSource" #table fxFill="100">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef> Id </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.id }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <mat-header-cell *matHeaderCellDef>First Name</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.firstName }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <mat-header-cell *matHeaderCellDef>Last Name</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.lastName }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="phone">
      <mat-header-cell *matHeaderCellDef>Phone</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.phone }} </mat-cell>
    </ng-container>
    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.email }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
  <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
  <mat-cell *matCellDef="let element">
    <button
      mat-button
      color="warn"
      type="button"
      (click)="deleteClient(element.id)">
      Delete
    </button>
  </mat-cell>
</ng-container>

    <mat-header-row
      *matHeaderRowDef="displayedColumns; sticky: true"
    ></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>
</div>
